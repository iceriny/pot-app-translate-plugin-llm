name: Check & Package Manggo Plugin

on:
  push:
    branches:
      - manggo
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build plugin archive
        run: npm run package

      - name: Verify plugin archive
        run: npm run verify-package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: manggo-plugin-${{ github.sha }}
          path: |
            dist/*.mplugin
            dist/sha256.txt
          if-no-files-found: error
